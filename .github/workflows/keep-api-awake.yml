# Keeps the Render free-tier API awake.
# GitHub schedule cron is often delayed (can be 30–40+ min apart), while Render
# sleeps after ~15 min idle. Each run therefore pings for ~32 minutes so coverage
# overlaps and the API rarely sleeps.
name: Keep API Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-api-awake.yml"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Keep Render API warm
        run: |
          URL="https://repopilot-api.onrender.com/health"
          # ~32 minutes of pings every 2 minutes (covers GitHub cron gaps)
          for i in $(seq 1 16); do
            echo "==== Ping $i/16 ===="
            CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json || true
              echo ""
            else
              echo "Wake attempt failed; will retry next cycle."
            fi
            if [ "$i" -lt 16 ]; then
              sleep 120
            fi
          done
          echo "Keep-alive window finished."
