# Keeps the Render free-tier API awake.
#
# GitHub's free schedule is unreliable (often ~60–90 min between runs), while
# Render sleeps after ~15 min idle. Each run therefore pings for ~90 minutes so
# consecutive runs overlap and the API stays warm almost continuously.
name: Keep API Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-api-awake.yml"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Keep Render API warm for 90 minutes
        run: |
          URL="https://repopilot-api.onrender.com/health"
          # 60 pings × 90s ≈ 90 minutes of continuous coverage
          for i in $(seq 1 60); do
            echo "==== Ping $i/60 ===="
            CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json || true
              echo ""
            else
              echo "Wake attempt failed; will retry next cycle."
            fi
            if [ "$i" -lt 60 ]; then
              sleep 90
            fi
          done
          echo "Keep-alive window finished."
