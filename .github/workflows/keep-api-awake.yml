# Keeps the Render free-tier API awake so visitors don't wait ~1 minute for a cold start.
# Render sleeps after ~15 minutes idle; this pings /health every 10 minutes.
name: Keep API Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-api-awake.yml"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoint
        run: |
          URL="https://repopilot-api.onrender.com/health"
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: GET $URL"
            CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json || true
              echo ""
              echo "API is awake."
              exit 0
            fi
            echo "Not ready yet; waiting 20s…"
            sleep 20
          done
          echo "Keep-alive failed after retries (API may still be deploying)."
          exit 1
